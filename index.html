<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAT Master Prep Tracker</title><link rel="stylesheet" href="static/css/app.css"></head><body>
<header><b>CAT Master Prep Tracker</b><span id="today"></span></header>
<nav><button data-t="gen" class="active">Daily Generator</button><button data-t="qa">QA Revision Log</button><button data-t="eod">EOD & Analytics</button><button data-t="settings">Settings</button></nav>
<main>
<section id="gen" class="active"><div class="hero"><div><h1>Today's Practice</h1><p>Generate VARC + DILR practice within your limits.</p></div><button id="generate">Generate Today's Practice</button></div><div class="cols"><div class="card"><h2>VARC</h2><div id="varc"></div></div><div class="card"><h2>DILR</h2><div id="dilr"></div></div></div></section>
<section id="qa"><h1>QA & Chapter Revision</h1><form id="qaf" class="card form"><label>Chapter<input id="chapter" required></label><label>Sub-topic<input id="subtopic" required></label><label>Category<select id="category"><option>Arithmetic</option><option>Algebra</option><option>Geometry</option><option>Number Systems</option><option>Modern Math</option></select></label><label>Stage<select id="stage"><option>New Concept</option><option>Revision 1 (7-Day)</option><option>Revision 2 (30-Day)</option><option>Mastered</option></select></label><label>Accuracy<input id="accuracy" placeholder="80% or 8/10"></label><label>Study minutes<input id="minutes" type="number" min="0" value="30"></label><label class="wide">Notes<textarea id="notes"></textarea></label><button>Add Revision Log</button></form><div id="qastats" class="stats"></div><div class="card table"><table><thead><tr><th>Date</th><th>Chapter</th><th>Sub-topic</th><th>Category</th><th>Stage</th><th>Accuracy</th><th>Time</th></tr></thead><tbody id="qat"></tbody></table></div></section>
<section id="eod"><h1>End-of-Day Summary</h1><div id="metrics" class="stats"></div><div class="cols"><div class="card"><h2>Daily Reflection & Key Takeaways</h2><textarea id="reflection"></textarea><button id="saveeod">Save Daily Log</button></div><div class="card"><h2>Recent EOD Logs</h2><div id="history"></div></div></div></section>
<section id="settings"><h1>Settings & Configuration</h1><form id="sf" class="card"><h2>RC Limits</h2><div id="rc" class="limits"></div><h2>DI / LR Limits</h2><div id="dl" class="limits"></div><div class="form"><label>CR question bank<input id="cr" type="number" min="1"></label><label>VA question bank<input id="va" type="number" min="1"></label></div><div class="actions"><button>Save Settings</button><button type="button" id="export">Export Backup</button><label class="file">Restore Backup<input id="restore" type="file" accept=".json"></label><button type="button" id="clear">Delete All Local Data</button></div></form></section>
</main><script src="static/js/app.js"></script></body></html>
